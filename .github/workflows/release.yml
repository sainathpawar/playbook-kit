name: release
# Publishes to npm when a version tag (v0.1.1, v0.2.0, ...) is pushed.
# Uses npm trusted publishing: no npm token is stored in GitHub.
# One-time setup: npmjs.com → package settings → Trusted publisher → GitHub Actions,
# repository = this repo, workflow file = release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # lets GitHub prove to npm which repo and workflow is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - run: npm ci
      - run: npm test
      - run: node dist/cli.js check --strict --no-skills
      - run: node dist/cli.js test
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish

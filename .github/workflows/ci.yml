name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: node dist/cli.js check --strict --no-skills
      - run: node dist/cli.js test
      - name: Compiled skills pass the official Agent Skills validator
        run: |
          pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
          node dist/cli.js build --out /tmp/out
          for d in /tmp/out/skills/* /tmp/out/cowork/* skills/*; do skills-ref validate "$d"; done
